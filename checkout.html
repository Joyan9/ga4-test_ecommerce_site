<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Store - Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-WPWB25ZW');</script>
    <!-- End Google Tag Manager -->
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WPWB25ZW"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <nav class="navbar">
        <div class="navbar__inner">
            <a href="index.html" class="navbar__logo">👟 <span>Stride</span>Store</a>
            <ul class="navbar__links">
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Shop</a></li>
                <li><a href="checkout.html">Cart</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-wrapper">
        <p class="breadcrumb"><a href="index.html">Home</a> / <a href="product.html">Shop</a> / Checkout</p>

        <div class="checkout-layout">
            <div>
                <div class="card">
                    <h2 class="card__title">Payment Details</h2>
                    <form onsubmit="submitOrder(event)">
                        <div class="form-group">
                            <label for="name">Cardholder Name</label>
                            <input type="text" id="name" placeholder="Jane Smith" required>
                        </div>
                        <div class="form-group">
                            <label for="card">Card Number</label>
                            <input type="text" id="card" placeholder="4242 4242 4242 4242" maxlength="19" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="expiry">Expiry Date</label>
                                <input type="text" id="expiry" placeholder="MM / YY" maxlength="7" required>
                            </div>
                            <div class="form-group">
                                <label for="cvv">CVV</label>
                                <input type="text" id="cvv" placeholder="123" maxlength="4" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn--primary" style="width:100%; margin-top:0.5rem;">
                            🔒 Complete Purchase — $100.00
                        </button>
                        <p class="secure-badge">🔐 Secured by 256-bit SSL encryption (test site)</p>
                    </form>
                </div>
            </div>

            <div>
                <div class="card">
                    <h2 class="card__title">Order Summary</h2>
                    <div class="order-summary__item">
                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200&q=80"
                             alt="Running Shoes">
                        <div class="order-summary__item-details">
                            <p class="order-summary__item-name">ProRun Elite Running Shoes</p>
                            <p class="order-summary__item-qty">Qty: 1</p>
                        </div>
                        <span class="order-summary__item-price">$100.00</span>
                    </div>
                    <div class="order-summary__totals">
                        <div class="order-summary__row">
                            <span>Subtotal</span>
                            <span>$100.00</span>
                        </div>
                        <div class="order-summary__row">
                            <span>Shipping</span>
                            <span>Free</span>
                        </div>
                        <div class="order-summary__row order-summary__row--total">
                            <span>Total</span>
                            <span>$100.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        &copy; 2025 StrideStore &mdash; Demo site for GA4 testing
    </footer>

    <script>
        window.dataLayer = window.dataLayer || [];
        function submitOrder(event) {
            event.preventDefault();
            var transactionId = 'T' + Date.now();
            dataLayer.push({
                'event': 'purchase',
                'ecommerce': {
                    'transaction_id': transactionId,
                    'value': 100,
                    'currency': 'USD',
                    'items': [{
                        'item_name': 'Running Shoes',
                        'price': 100,
                        'quantity': 1
                    }]
                }
            });
            window.location.href = 'thankyou.html';
        }
    </script>
</body>
</html>
